<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>Arquitectura Final · Operación Contención Manta (SpookyThon 2026 · Track B)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d19"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="960" fill="url(#bg)"/>

  <!-- TÍTULO -->
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#f8fafc">🧟 Operación Contención Manta · Arquitectura AWS Serverless Final</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">SpookyThon 2026 · Track B · Zonas Públicas vs. Privadas · Región us-east-2 · Gasto real del hackathon: $0.00 USD</text>

  <!-- ============ ZONA PÚBLICA ============ -->
  <rect x="30" y="80" width="1340" height="240" rx="14" fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="50" y="104" font-size="14" font-weight="700" fill="#38bdf8">🌐 ZONA PÚBLICA (Internet · HTTPS / TLS 1.3)</text>

  <!-- Navegador -->
  <rect x="60" y="118" width="430" height="184" rx="12" fill="#0b1324" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="275" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">👤 Navegador del Usuario / Jurado</text>
  <text x="80" y="170" font-size="12.5" fill="#cbd5e1">• Leaflet GIS (Esri Calles Oscuro / Satélite) + 🖥️ Fullscreen</text>
  <text x="80" y="191" font-size="12.5" fill="#cbd5e1">• Chart.js (bandas Mín–Máx Monte Carlo + SEIR)</text>
  <text x="80" y="212" font-size="12.5" fill="#cbd5e1">• 🧠 Auto-Optimizador Presupuestario IA (umbrales stock)</text>
  <text x="80" y="233" font-size="12.5" fill="#cbd5e1">• 📄 Informe Ejecutivo Automático para el Alcalde</text>
  <text x="80" y="254" font-size="12.5" fill="#cbd5e1">• QA: Anti-Spam, clamping, seguros NaN / ÷0</text>
  <rect x="78" y="264" width="394" height="26" rx="6" fill="rgba(52,211,153,0.12)" stroke="#34d399"/>
  <text x="275" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#6ee7b7">⚡ Fallback Local Instantáneo: mulberry32(seed) + FNV-1a</text>

  <!-- Amplify -->
  <rect x="560" y="134" width="320" height="152" rx="12" fill="#0b1324" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="720" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">☁️ AWS Amplify Hosting</text>
  <text x="720" y="188" text-anchor="middle" font-size="12.5" fill="#cbd5e1">CDN global + certificado HTTPS</text>
  <text x="720" y="209" text-anchor="middle" font-size="12.5" fill="#cbd5e1">index.html · styles.css · app.js</text>
  <text x="720" y="230" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Sin buckets S3 públicos</text>
  <text x="720" y="262" text-anchor="middle" font-size="11.5" fill="#a78bfa">prod.d1yapm4cwo9o63.amplifyapp.com</text>

  <!-- Open-Meteo -->
  <rect x="950" y="134" width="390" height="152" rx="12" fill="#0b1324" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="1145" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">🌤️ Open-Meteo API (externa)</text>
  <text x="1145" y="188" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Temperatura · Humedad · Precipitación en Manta</text>
  <text x="1145" y="209" text-anchor="middle" font-size="12.5" fill="#cbd5e1">Calibración β con curva térmica de Brière</text>
  <rect x="980" y="224" width="330" height="44" rx="6" fill="rgba(251,191,36,0.10)" stroke="#fbbf24"/>
  <text x="1145" y="242" text-anchor="middle" font-size="11.5" fill="#fde68a">Fallback Resiliente: AbortController 3,500 ms</text>
  <text x="1145" y="259" text-anchor="middle" font-size="11.5" fill="#fde68a">→ 26 °C / 78 % "Clima Promedio (Modo Offline)"</text>

