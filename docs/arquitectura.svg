  <text x="865" y="704" text-anchor="middle" font-size="12" fill="#cbd5e1">Retención acotada</text>
  <text x="865" y="750" text-anchor="middle" font-size="11" fill="#94a3b8">IAM: logs:PutLogEvents (grupo propio)</text>

