  <rect x="30" y="345" width="1340" height="200" rx="14" fill="rgba(249,115,22,0.05)" stroke="#f97316" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="50" y="369" font-size="14" font-weight="700" fill="#fb923c">⚙️ CÓMPUTO SERVERLESS (URL pública HTTPS · runtime aislado)</text>

  <rect x="330" y="380" width="740" height="150" rx="12" fill="#0b1324" stroke="#f97316" stroke-width="1.8"/>
  <text x="700" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">λ AWS Lambda Function URL · Python 3.12 · 512 MB · 20 s</text>
  <text x="700" y="427" text-anchor="middle" font-size="12.5" fill="#cbd5e1">infra/lambda_simulador.py · SEIR estocástico + Escudo de Centralidad · CORS · input clamping</text>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="360" y="442" width="124" height="44" rx="8" fill="rgba(249,115,22,0.14)" stroke="#fb923c"/>
    <text x="422" y="469" fill="#fed7aa">Worker 1</text>
    <rect x="500" y="442" width="124" height="44" rx="8" fill="rgba(249,115,22,0.14)" stroke="#fb923c"/>
    <text x="562" y="469" fill="#fed7aa">Worker 2</text>
    <rect x="640" y="442" width="124" height="44" rx="8" fill="rgba(249,115,22,0.14)" stroke="#fb923c"/>
    <text x="702" y="469" fill="#fed7aa">Worker 3</text>
    <rect x="780" y="442" width="124" height="44" rx="8" fill="rgba(249,115,22,0.14)" stroke="#fb923c"/>
    <text x="842" y="469" fill="#fed7aa">Worker 4</text>
    <rect x="920" y="442" width="124" height="44" rx="8" fill="rgba(249,115,22,0.14)" stroke="#fb923c"/>
    <text x="982" y="469" fill="#fed7aa">Worker 5</text>
  </g>
  <text x="700" y="514" text-anchor="middle" font-size="12" fill="#fdba74">Fan-Out 5 Workers concurrentes (Promise.all) · sub-semillas particionadas · reducción FNV-1a idéntica</text>

  <!-- Navegador ↔ Lambda -->
  <path d="M 200 302 L 200 455 L 326 455" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>
  <text x="70" y="400" font-size="11.5" fill="#67e8f9">POST HTTPS ×5</text>
  <text x="70" y="416" font-size="11.5" fill="#67e8f9">(Promise.all)</text>
  <text x="70" y="432" font-size="11.5" fill="#67e8f9">JSON resultados</text>

  <!-- Lambda → Open-Meteo -->
  <path d="M 1070 455 L 1250 455 L 1250 290" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
