  <path d="M 380 118 L 380 112 L 1145 112 L 1145 130" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <text x="900" y="106" text-anchor="middle" font-size="11" fill="#fde68a">GET clima en vivo (timeout 3.5 s)</text>

